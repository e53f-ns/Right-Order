# ══════════════════════════════════════════════
# Right Order — Docker Compose (Production)
# ══════════════════════════════════════════════
# Usage:
#   cp .env.example .env   # configure all variables
#   docker compose up -d
#   docker compose exec backend npx prisma migrate deploy
# ══════════════════════════════════════════════

services:
  # ── PostgreSQL (internal network only) ──
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    user: "70:70"  # postgres uid/gid in alpine image
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rightorder}
      POSTGRES_USER: ${POSTGRES_USER:-rightorder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No `ports:` mapping — postgres is only reachable via the internal
    # backend-net network. Use `docker compose exec postgres ...` for admin.
    networks:
      - backend-net
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rightorder} -d ${POSTGRES_DB:-rightorder}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Backend (Node.js + Prisma) ──
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-rightorder}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rightorder}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      CRYPTO_USDT_TRC20_ADDRESS: ${CRYPTO_USDT_TRC20_ADDRESS:-}
      CRYPTO_USDT_ERC20_ADDRESS: ${CRYPTO_USDT_ERC20_ADDRESS:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    # Bind to loopback only — backend is fronted by nginx (frontend service).
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"
    networks:
      - backend-net
      - frontend-net
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Frontend (Nginx + Vite build) — public entrypoint ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3100}:80"
    networks:
      - frontend-net
    security_opt:
      - no-new-privileges:true
    read_only: true
    # nginx writes to cache/run/log dirs — tmpfs lets us keep the FS read-only.
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Internal network — backend <-> postgres only, not reachable from host.
  backend-net:
    driver: bridge
    internal: true
  # Frontend <-> backend reverse-proxy network.
  frontend-net:
    driver: bridge

volumes:
  pgdata:
