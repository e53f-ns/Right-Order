# ══════════════════════════════════════════════
# Right Order — PostgreSQL tuning (small VPS, 2-4GB RAM)
# ══════════════════════════════════════════════
# Mounted at /etc/postgresql/postgresql.conf in the postgres container
# and loaded via `-c config_file=...` in docker-compose command.

# ── Connections ──
listen_addresses = '*'
max_connections = 50
superuser_reserved_connections = 3

# ── Memory ──
# Sized for ~512MB-1GB available to postgres on a 2-4GB VPS.
shared_buffers = 256MB              # ~25% of postgres-allocated RAM
effective_cache_size = 768MB        # OS cache estimate
work_mem = 8MB                      # per sort/hash op; 50 conn * 8MB worst-case = 400MB
maintenance_work_mem = 64MB
huge_pages = try

# ── WAL / Durability ──
wal_buffers = 16MB
checkpoint_completion_target = 0.9
min_wal_size = 80MB
max_wal_size = 1GB

# ── Planner ──
random_page_cost = 1.1              # SSD-friendly
effective_io_concurrency = 200      # SSD
default_statistics_target = 100

# ── Logging ──
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 1000   # log queries slower than 1s
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 0
log_line_prefix = '%t [%p] %q%u@%d '
log_timezone = 'UTC'

# ── Statistics / Monitoring ──
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
track_io_timing = on

# ── Autovacuum ──
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s

# ── Misc ──
timezone = 'UTC'
datestyle = 'iso, mdy'
